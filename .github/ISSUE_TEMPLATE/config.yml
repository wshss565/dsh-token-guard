name: 高峰计价对账（重要）
description: 补充高峰时段的计价实测数据
labels: 高峰对账, data
body: |
  ## 为什么需要这个

  本插件的计价公式已在**空闲时段**用官方账本精确验证（比值 1.0000）。
  但所有历史样本都产生于深夜与周末，**高峰时段（工作日 9-12 / 14-18）从未被采样**，
  因此 `×1` 系数目前仅有官方文档依据，缺实测背书。

  ## 需要你做的

  在工作日高峰时段正常使用 dsh 至少一轮，然后：

  ```bash
  npm run dump
  ```

  贴出输出，以及同一时段的 `~/.dsh/.dshw-usage.json` 对应记录。

  ## 对账方法

  插件按 `cost = (cacheRead×hit + input×miss + output×out) × 时段系数 / 1e6` 计价。
  若 `dump` 的结果与官方 cost 不一致，请附上两条记录，便于定位口径差异。
